<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои сайты — личная коллекция ссылок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --text:#f4f5fb;
    --muted:#8a8fa8;
    --muted-dim:#5a5f7a;
    --line:rgba(255,255,255,.07);
    --line-hover:rgba(255,255,255,.14);
    --glass:rgba(255,255,255,.03);
    --glass-2:rgba(255,255,255,.06);
    --c1:#7c5cff;
    --c2:#22d3ee;
    --c3:#ff5c9d;
    --radius:20px;
    --shadow-lg:0 30px 60px -20px rgba(0,0,0,.9);
  }
  *{
    box-sizing:border-box;margin:0;padding:0;
    -webkit-tap-highlight-color: transparent;
  }
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  ::selection{background:rgba(124,92,255,.4);color:#fff}

  /* Убираем синюю подсветку и стандартный фокус мышью,
     но сохраняем видимый фокус для клавиатуры */
  button, input, a, label{
    -webkit-tap-highlight-color: transparent;
  }
  button:focus, input:focus, a:focus, label:focus{ outline: none; }
  button:focus-visible,
  input:focus-visible,
  a:focus-visible{
    outline: 2px solid rgba(124,92,255,.7);
    outline-offset: 3px;
  }
  a, button{ user-select: none; }

  body{
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    background:#07070f;
    color:var(--text);
    min-height:100vh;
    padding:48px 24px 120px;
    overflow-x:hidden;
    position:relative;
  }

  /* ============ ФОН ============ */
  .bg-mesh{
    position:fixed;inset:0;z-index:-3;
    background:
      radial-gradient(ellipse 70% 50% at 15% 0%,   rgba(124,92,255,.35), transparent 65%),
      radial-gradient(ellipse 60% 45% at 100% 15%, rgba(34,211,238,.20), transparent 65%),
      radial-gradient(ellipse 55% 50% at 50% 100%, rgba(255,92,157,.20), transparent 65%),
      radial-gradient(ellipse 40% 35% at 85% 70%,  rgba(168,85,247,.18), transparent 65%),
      #07070f;
    animation:meshShift 24s ease-in-out infinite;
  }
  @keyframes meshShift{
    0%,100%{transform:scale(1) translate(0,0)}
    50%{transform:scale(1.08) translate(-2%,2%)}
  }
  .bg-noise{
    position:fixed;inset:0;z-index:-2;
    opacity:.045;
    pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .bg-vignette{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(7,7,15,.7) 100%);
  }

  .wrap{max-width:880px;margin:0 auto;position:relative}

  /* ============ ЗАГОЛОВОК ============ */
  header{text-align:center;margin-bottom:44px;animation:riseIn .8s cubic-bezier(.22,1,.36,1) both}

  .badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 18px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);
    font-size:11.5px;font-weight:700;color:var(--muted);
    letter-spacing:1.2px;text-transform:uppercase;
    margin-bottom:22px;
    backdrop-filter:blur(20px);
  }
  .badge .dot{
    width:6px;height:6px;border-radius:50%;
    background:#3ddc97;
    box-shadow:0 0 0 3px rgba(61,220,151,.15),0 0 12px #3ddc97;
    animation:pulseDot 2.4s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.5;transform:scale(.85)}
  }

  h1{
    font-size:clamp(38px,7vw,62px);
    font-weight:800;
    letter-spacing:-2.5px;
    line-height:1;
    background:linear-gradient(180deg,#fff 0%,#b8bde0 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    margin-bottom:20px;
  }
  header .sub{
    color:var(--muted);
    font-size:16px;line-height:1.6;
    max-width:440px;
    margin:0 auto;
  }

  @keyframes riseIn{
    from{opacity:0;transform:translateY(30px)}
    to{opacity:1;transform:none}
  }

  /* ============ ФОРМА ДОБАВЛЕНИЯ ============ */
  .add-card{
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px;
    backdrop-filter:blur(20px) saturate(150%);
    box-shadow:var(--shadow-lg);
    transition:.35s cubic-bezier(.22,1,.36,1);
    animation:riseIn .8s .1s cubic-bezier(.22,1,.36,1) both;
  }
  .add-card:focus-within{
    border-color:rgba(124,92,255,.4);
    box-shadow:
      0 0 0 4px rgba(124,92,255,.08),
      0 30px 60px -20px rgba(124,92,255,.3);
  }

  form.add-form{
    display:flex;align-items:center;gap:2px;
    min-height:56px;
  }

  .field{
    flex:1;min-width:0;
    display:flex;align-items:center;
    padding:0 16px;
    height:56px;
    border-radius:14px;
    transition:.25s;
    cursor:text;
  }
  .field:focus-within{background:var(--glass-2)}
  .field-icon{
    font-size:15px;opacity:.55;
    flex-shrink:0;margin-right:10px;
    transition:.25s;
    user-select:none;
  }
  .field:focus-within .field-icon{opacity:1;transform:scale(1.1)}
  .field input{
    flex:1;min-width:0;
    background:transparent;border:none;outline:none;
    color:var(--text);
    font-family:inherit;font-size:15px;font-weight:500;
    padding:0;
  }
  .field input::placeholder{color:var(--muted-dim);font-weight:400}

  .divider{
    width:1px;height:24px;
    background:var(--line);
    flex-shrink:0;
  }

  .btn-add{
    position:relative;
    height:56px;
    padding:0 26px;
    border:none;cursor:pointer;
    border-radius:14px;
    font-family:inherit;font-size:15px;font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,#7c5cff,#a855f7 55%,#ff5c9d);
    background-size:200% 200%;
    box-shadow:0 12px 30px -12px rgba(124,92,255,.8);
    display:flex;align-items:center;gap:8px;
    transition:.3s cubic-bezier(.22,1,.36,1);
    overflow:hidden;
    white-space:nowrap;
    flex-shrink:0;
  }
  .btn-add span{position:relative;z-index:1}
  .btn-add .plus{
    font-size:18px;line-height:1;
    display:inline-block;
    transition:transform .3s;
  }
  .btn-add::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
    transform:translateX(-100%);
    transition:transform .7s;
  }
  .btn-add:hover{
    transform:translateY(-2px);
    box-shadow:0 20px 40px -12px rgba(124,92,255,1);
    background-position:100% 0;
  }
  .btn-add:hover::before{transform:translateX(100%)}
  .btn-add:hover .plus{transform:rotate(90deg)}
  .btn-add:active{transform:translateY(0) scale(.98)}

  @media(max-width:720px){
    form.add-form{flex-direction:column;gap:0;padding:8px;height:auto}
    .field{width:100%;height:52px;border-bottom:1px solid var(--line)}
    .field:last-of-type{border-bottom:none}
    .divider{display:none}
    .btn-add{width:100%;margin-top:8px;justify-content:center}
    .add-card{padding:0}
  }

  /* ============ ТУЛБАР ============ */
  .toolbar{
    display:flex;gap:12px;align-items:center;
    margin:36px 0 24px;flex-wrap:wrap;
    animation:riseIn .8s .2s cubic-bezier(.22,1,.36,1) both;
  }

  .search-wrap{
    flex:1;min-width:200px;
    position:relative;
    display:flex;align-items:center;
    height:48px;
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:14px;
    padding:0 14px 0 44px;
    transition:.25s;
  }
  .search-wrap:focus-within{
    border-color:rgba(34,211,238,.4);
    background:var(--glass-2);
    box-shadow:0 0 0 4px rgba(34,211,238,.06);
  }
  .search-icon{
    position:absolute;left:16px;
    width:16px;height:16px;
    color:var(--muted);
    pointer-events:none;
    transition:.2s;
  }
  .search-wrap:focus-within .search-icon{color:var(--c2)}
  .search-wrap input{
    width:100%;height:100%;
    background:transparent;border:none;outline:none;
    color:var(--text);
    font-family:inherit;font-size:14.5px;font-weight:500;
  }
  .search-wrap input::placeholder{color:var(--muted-dim)}

  .sort-btn{
    height:48px;
    padding:0 16px;
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:14px;
    color:var(--muted);
    font-family:inherit;font-size:13.5px;font-weight:600;
    cursor:pointer;
    display:flex;align-items:center;gap:8px;
    transition:.2s;
    white-space:nowrap;
  }
  .sort-btn:hover{background:var(--glass-2);color:var(--text);border-color:var(--line-hover)}
  .sort-btn svg{width:14px;height:14px;transition:transform .3s}
  .sort-btn.name svg{transform:rotate(180deg)}

  .counter{
    height:48px;padding:0 20px;
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:14px;
    display:flex;align-items:center;gap:8px;
    font-size:13.5px;font-weight:600;color:var(--muted);
    white-space:nowrap;
  }
  .counter b{
    background:linear-gradient(135deg,#7c5cff,#22d3ee);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    font-size:17px;font-weight:800;
    min-width:1ch;text-align:center;
  }

  /* ============ СПИСОК ============ */
  ul#list{list-style:none;display:flex;flex-direction:column;gap:10px}

  li.item{
    display:flex;align-items:center;gap:16px;
    padding:16px 18px;
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:16px;
    position:relative;
    transition:.3s cubic-bezier(.22,1,.36,1);
    animation:cardPop .5s cubic-bezier(.22,1,.36,1) both;
  }
  li.item::before{
    content:'';position:absolute;
    left:-1px;top:20%;bottom:20%;width:2px;
    border-radius:2px;
    background:linear-gradient(180deg,var(--c1),var(--c2));
    opacity:0;
    transition:.35s cubic-bezier(.22,1,.36,1);
  }
  li.item:hover{
    background:var(--glass-2);
    border-color:var(--line-hover);
    transform:translateX(4px);
    box-shadow:0 18px 40px -20px rgba(0,0,0,.7);
  }
  li.item:hover::before{opacity:1;top:10%;bottom:10%}

  @keyframes cardPop{
    from{opacity:0;transform:translateY(-12px) scale(.97)}
    to{opacity:1;transform:none}
  }

  li.item.removing{
    animation:vanish .35s cubic-bezier(.5,0,1,.5) forwards;
  }
  @keyframes vanish{
    to{opacity:0;transform:translateX(60px) scale(.9);
       max-height:0;padding-top:0;padding-bottom:0;margin-bottom:-10px;border-width:0}
  }

  .favicon{
    position:relative;
    width:44px;height:44px;flex-shrink:0;
    border-radius:12px;
    display:grid;place-items:center;
    overflow:hidden;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.2),
      0 6px 16px -6px rgba(0,0,0,.5);
  }
  .favicon .letter{
    position:absolute;inset:0;
    display:grid;place-items:center;
    font-weight:800;font-size:18px;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.25);
    letter-spacing:-.5px;
  }
  .favicon img{
    position:relative;z-index:1;
    width:100%;height:100%;
    object-fit:contain;
    padding:9px;
    background:rgba(255,255,255,.97);
  }

  .info{flex:1;min-width:0}
  .info .name{
    font-weight:700;font-size:15.5px;
    letter-spacing:-.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    line-height:1.35;
  }
  .info .url{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12.5px;font-weight:500;
    color:var(--muted);
    text-decoration:none;
    margin-top:4px;
    max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:.2s;
  }
  .info .url:hover{color:var(--c2)}
  .info .url svg{flex-shrink:0;opacity:.5;transition:.2s}
  .info .url:hover svg{opacity:1;transform:translate(1px,-1px)}

  .actions{display:flex;gap:6px;flex-shrink:0}
  .icon-btn{
    width:36px;height:36px;
    display:grid;place-items:center;
    background:transparent;
    border:1px solid transparent;
    color:var(--muted-dim);
    border-radius:10px;
    cursor:pointer;
    transition:.2s cubic-bezier(.22,1,.36,1);
  }
  .icon-btn svg{width:15px;height:15px;transition:.2s}
  .icon-btn:hover{
    background:var(--glass-2);
    border-color:var(--line);
    color:var(--text);
    transform:translateY(-1px);
  }
  .icon-btn.copy:hover{color:#a855f7;border-color:rgba(168,85,247,.3);box-shadow:0 0 16px -4px rgba(168,85,247,.6)}
  .icon-btn.open:hover{color:var(--c2);border-color:rgba(34,211,238,.3);box-shadow:0 0 16px -4px rgba(34,211,238,.6)}
  .icon-btn.del:hover{color:var(--c3);border-color:rgba(255,92,157,.3);box-shadow:0 0 16px -4px rgba(255,92,157,.6)}

  /* ============ ПУСТОЕ СОСТОЯНИЕ ============ */
  .empty{
    text-align:center;
    padding:80px 20px;
    animation:riseIn .5s ease both;
  }
  .empty-icon{
    width:88px;height:88px;
    margin:0 auto 24px;
    border-radius:26px;
    background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(34,211,238,.08));
    border:1px solid var(--line);
    display:grid;place-items:center;
    animation:floatIcon 4s ease-in-out infinite;
  }
  .empty-icon svg{width:38px;height:38px}
  @keyframes floatIcon{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  .empty h3{
    font-size:20px;font-weight:700;
    letter-spacing:-.3px;
    margin-bottom:10px;
  }
  .empty p{
    color:var(--muted);
    font-size:14.5px;line-height:1.65;
    max-width:340px;margin:0 auto;
  }

  /* ============ ФУТЕР ============ */
  footer{
    text-align:center;
    margin-top:56px;
    color:var(--muted-dim);
    font-size:12.5px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  footer svg{width:13px;height:13px}

  /* ============ ТОСТ ============ */
  #toast{
    position:fixed;left:50%;bottom:32px;
    transform:translate(-50%,160%);
    display:flex;align-items:center;gap:12px;
    padding:14px 22px;
    background:rgba(18,19,32,.95);
    backdrop-filter:blur(24px);
    border-radius:16px;
    color:#fff;
    font-size:14px;font-weight:600;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.95);
    transition:transform .45s cubic-bezier(.22,1,.36,1);
    z-index:100;
    pointer-events:none;
    white-space:nowrap;
  }
  #toast::before{
    content:'';position:absolute;inset:0;
    border-radius:16px;padding:1px;
    background:linear-gradient(135deg,rgba(124,92,255,.6),rgba(34,211,238,.6));
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }
  #toast.show{transform:translate(-50%,0)}
  #toast .ticon{
    width:24px;height:24px;
    border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(135deg,#3ddc97,#22d3ee);
    font-size:13px;font-weight:900;
    flex-shrink:0;
    box-shadow:0 0 16px -2px rgba(61,220,151,.6);
  }
  #toast.error::before{
    background:linear-gradient(135deg,rgba(255,92,157,.6),rgba(255,124,92,.6));
  }
  #toast.error .ticon{
    background:linear-gradient(135deg,#ff5c9d,#ff7c5c);
    box-shadow:0 0 16px -2px rgba(255,92,157,.6);
  }

  /* Скроллбар */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.06);
    border-radius:10px;border:2px solid #07070f;
  }
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.14)}

  @media(max-width:520px){
    body{padding:32px 16px 90px}
    li.item{gap:12px;padding:14px}
    .favicon{width:40px;height:40px}
    .favicon .letter{font-size:16px}
    .icon-btn{width:34px;height:34px}
    .info .name{font-size:14.5px}
    .actions .icon-btn.copy{display:none}
  }
</style>
</head>
<body>

<div class="bg-mesh"></div>
<div class="bg-noise"></div>
<div class="bg-vignette"></div>

<div class="wrap">

  <header>
    <div class="badge"><span class="dot"></span> Личная коллекция</div>
    <h1>Мои сайты</h1>
    <p class="sub">Красивое место, где живут все твои любимые ссылки — с иконками, поиском и мгновенным доступом.</p>
  </header>

  <div class="add-card">
    <form id="addForm" class="add-form" autocomplete="off">
      <label class="field">
        <span class="field-icon">✏️</span>
        <input type="text" id="nameInput" placeholder="Название сайта" required maxlength="80">
      </label>
      <span class="divider"></span>
      <label class="field">
        <span class="field-icon">🔗</span>
        <input type="url" id="urlInput" placeholder="https://example.com" required>
      </label>
      <button type="submit" class="btn-add">
        <span>Добавить</span>
        <span class="plus">＋</span>
      </button>
    </form>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
      </svg>
      <input type="search" id="searchInput" placeholder="Поиск по названию или ссылке...">
    </div>
    <button class="sort-btn" id="sortBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <polyline points="19 12 12 19 5 12"></polyline>
      </svg>
      <span id="sortLabel">Недавние</span>
    </button>
    <div class="counter"><b id="countNum">0</b> сайтов</div>
  </div>

  <ul id="list"></ul>

  <footer>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <span>Данные хранятся только в вашем браузере</span>
  </footer>

</div>

<div id="toast"><span class="ticon">✓</span><span id="toastMsg"></span></div>

<script>
(function(){
  const STORAGE_KEY = 'my_sites_v3';
  const $ = id => document.getElementById(id);

  const listEl   = $('list');
  const form     = $('addForm');
  const nameInput= $('nameInput');
  const urlInput = $('urlInput');
  const searchEl = $('searchInput');
  const countNum = $('countNum');
  const toastEl  = $('toast');
  const toastMsg = $('toastMsg');
  const ticon    = toastEl.querySelector('.ticon');
  const sortBtn  = $('sortBtn');
  const sortLabel= $('sortLabel');

  let sites = load();
  let sortMode = 'recent';
  let toastTimer = null;

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const data = raw ? JSON.parse(raw) : [];
      return Array.isArray(data) ? data : [];
    }catch(e){ return []; }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(sites)); }catch(e){}
  }

  function toast(msg, isError){
    toastMsg.textContent = msg;
    ticon.textContent = isError ? '!' : '✓';
    toastEl.classList.toggle('error', !!isError);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2000);
  }
  function normalizeUrl(u){
    u = u.trim();
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }
  function domainOf(url){
    try{ return new URL(url).hostname.replace(/^www\./,''); }
    catch(e){ return url; }
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function hashColor(str){
    let h = 0;
    for(let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
    const hue = Math.abs(h) % 360;
    return `linear-gradient(135deg, hsl(${hue},72%,58%), hsl(${(hue+45)%360},72%,45%))`;
  }
  function faviconUrl(url){
    return `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(domainOf(url))}`;
  }

  const icons = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="11" height="11"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>'
  };

  function render(){
    const q = searchEl.value.trim().toLowerCase();
    let filtered = q
      ? sites.filter(s => s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q))
      : sites.slice();

    if(sortMode === 'name'){
      filtered.sort((a,b) => a.name.localeCompare(b.name, 'ru', {sensitivity:'base'}));
    }

    listEl.innerHTML = '';

    if(filtered.length === 0){
      const div = document.createElement('div');
      div.className = 'empty';
      if(sites.length === 0){
        div.innerHTML = `
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#g1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#22d3ee"/>
              </linearGradient></defs>
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <h3>Здесь пока пусто</h3>
          <p>Добавь свою первую ссылку — и коллекция начнёт собираться.</p>`;
      } else {
        div.innerHTML = `
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#g1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#22d3ee"/>
              </linearGradient></defs>
              <circle cx="11" cy="11" r="7"/>
              <line x1="21" y1="21" x2="16.5" y2="16.5"/>
            </svg>
          </div>
          <h3>Ничего не найдено</h3>
          <p>Попробуй изменить запрос или добавить новую ссылку.</p>`;
      }
      listEl.appendChild(div);
    }

    filtered.forEach((site, i) => {
      const li = document.createElement('li');
      li.className = 'item';
      li.style.animationDelay = Math.min(i * 35, 280) + 'ms';
      const domain = domainOf(site.url);
      const letter = (site.name || domain).charAt(0).toUpperCase();
      const bg = hashColor(domain);

      li.innerHTML = `
        <div class="favicon" style="background:${bg}">
          <span class="letter">${esc(letter)}</span>
          <img src="${esc(faviconUrl(site.url))}" alt="" loading="lazy" onerror="this.remove()">
        </div>
        <div class="info">
          <div class="name" title="${esc(site.name)}">${esc(site.name)}</div>
          <a class="url" href="${esc(site.url)}" target="_blank" rel="noopener noreferrer" title="${esc(site.url)}">
            ${esc(domain)} ${icons.link}
          </a>
        </div>
        <div class="actions">
          <button class="icon-btn copy" title="Скопировать ссылку">${icons.copy}</button>
          <button class="icon-btn open" title="Открыть в новой вкладке">${icons.open}</button>
          <button class="icon-btn del"  title="Удалить">${icons.trash}</button>
        </div>
      `;

      li.querySelector('.copy').addEventListener('click', async () => {
        try{
          await navigator.clipboard.writeText(site.url);
          toast('Ссылка скопирована');
        }catch(e){
          toast('Не удалось скопировать', true);
        }
      });

      li.querySelector('.open').addEventListener('click', () => {
        window.open(site.url, '_blank', 'noopener');
      });

      li.querySelector('.del').addEventListener('click', () => {
        li.classList.add('removing');
        setTimeout(() => {
          sites = sites.filter(s => s.id !== site.id);
          save();
          render();
          toast('Удалено');
        }, 340);
      });

      listEl.appendChild(li);
    });

    animateCount(parseInt(countNum.textContent, 10) || 0, sites.length);
  }

  function animateCount(from, to){
    if(from === to){ countNum.textContent = to; return; }
    const duration = 400;
    const start = performance.now();
    function step(t){
      const p = Math.min((t - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      countNum.textContent = Math.round(from + (to - from) * eased);
      if(p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = nameInput.value.trim();
    let url = urlInput.value.trim();
    if(!name || !url){ toast('Заполни оба поля', true); return; }

    url = normalizeUrl(url);
    try{ new URL(url); }
    catch(err){ toast('Некорректная ссылка', true); return; }

    sites.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      name, url
    });
    save();
    form.reset();
    nameInput.focus();
    render();
    toast('Сайт добавлен');
  });

  searchEl.addEventListener('input', render);

  sortBtn.addEventListener('click', () => {
    sortMode = sortMode === 'recent' ? 'name' : 'recent';
    sortBtn.classList.toggle('name', sortMode === 'name');
    sortLabel.textContent = sortMode === 'name' ? 'По названию' : 'Недавние';
    render();
  });

  document.addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      searchEl.focus();
      searchEl.select();
    }
    if(e.key === 'Escape' && document.activeElement === searchEl){
      searchEl.value = '';
      render();
      searchEl.blur();
    }
  });

  render();
})();
</script>
</body>
</html>
